# Echo backend used by E2E tests.
#
# Returns 200 with a small JSON body so MCP-format responses can be verified,
# and surfaces the upstream-visible Authorization header via X-Echo-Authorization
# (empty when nginx-mcp-resource correctly strips it).

events {}

http {
    server {
        listen 80 default_server;

        location / {
            default_type application/json;
            add_header X-Echo-Authorization "$http_authorization" always;
            return 200 '{"backend":"e2e-echo","path":"$request_uri"}';
        }
    }
}
