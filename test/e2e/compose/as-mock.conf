# Mock Authorization Server (introspect-only) used by introspect-mode E2E.
#
# RFC 7662 introspection endpoint: returns a deterministic response keyed off
# the introspected token value (read from the `token` form parameter).
# Supported tokens (everything else -> active:false):
#   - e2e-valid              : active=true,  aud=canonical, scope=mcp:read
#   - e2e-wrong-aud          : active=true,  aud=other,     scope=mcp:read
#   - e2e-insufficient-scope : active=true,  aud=canonical, scope=other:scope
#
# CANONICAL_URI is templated by the docker-compose run (envsubst-on-templates).

events {}

http {
    # nginx reads the form body via $arg_token when the client passes
    # token=... in the query string; AS clients usually POST application/x-www-
    # form-urlencoded so we accept it through the body too.
    map $request_body $introspect_token {
        default "";
        "~token=([^&]+)" $1;
    }

    server {
        listen 80 default_server;

        # Capture the form-encoded body so the map above can inspect it.
        client_body_in_single_buffer on;
        client_body_buffer_size 8k;

        location = /introspect {
            default_type application/json;

            # Force body buffering even on POST without Content-Length issues.
            client_max_body_size 8k;

            # nginx evaluates `if` in REWRITE phase and only one branch wins;
            # use chained map output via $introspect_response below.
            return 200 $introspect_response;
        }

        # Fallback for any other path.
        location / {
            default_type application/json;
            return 200 '{"error":"unknown_endpoint"}';
        }
    }

    map $introspect_token $introspect_response {
        default                       '{"active":false}';
        "e2e-valid"                   '{"active":true,"sub":"u","aud":"${MCP_CANONICAL_URI}","scope":"mcp:read","exp":4133862000}';
        "e2e-wrong-aud"               '{"active":true,"sub":"u","aud":"https://other.example.com/mcp","scope":"mcp:read","exp":4133862000}';
        "e2e-insufficient-scope"      '{"active":true,"sub":"u","aud":"${MCP_CANONICAL_URI}","scope":"other:scope","exp":4133862000}';
    }
}
