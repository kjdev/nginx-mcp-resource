# Example: MCP Resource Server with JWT validation (nginx-auth-jwt 0.13.1+)
#
# Adjust the following before deployment:
#   - load_module path
#   - server_name / canonical URIs / metadata URIs
#   - ssl_certificate / ssl_certificate_key
#   - upstream mcp_backend
#   - auth_jwt_key_file (JWKS path)
#   - include paths under conf/ (this example assumes conf/ lives next to
#     nginx.conf; relative paths resolve against the nginx prefix)
#
# Required scope is `mcp:read` in this example; tune $mcp_required_scope
# and the `map $jwt_scope $mcp_has_required_scope` regex together.

load_module /usr/lib/nginx/modules/ngx_http_auth_jwt_module.so;

worker_processes 1;
events {}

http {
    # === MCP metadata (edit to match your deployment) ============
    # $mcp_canonical_uri is the plain URL shown in WWW-Authenticate.
    # $mcp_canonical_uri_json is the SAME URL quoted as a JSON string;
    # auth_jwt_require_claim parses variable values as JSON, so the
    # `aud` comparison needs the JSON-quoted form (see V2-7).
    map "" $mcp_canonical_uri      { default "https://mcp.example.com/mcp"; }
    map "" $mcp_canonical_uri_json { default '"https://mcp.example.com/mcp"'; }
    map "" $mcp_metadata_uri       { default "https://mcp.example.com/.well-known/oauth-protected-resource"; }
    map "" $mcp_required_scope     { default "mcp:read"; }

    # === JWT claim extraction ====================================
    auth_jwt_claim_set $jwt_scope scope;

    # === Scope evaluation ========================================
    map $jwt_scope $mcp_has_required_scope {
        default 0;
        "~(^|\s)mcp:read(\s|$)" 1;
    }

    # === Upstream MCP backend ====================================
    upstream mcp_backend {
        server 127.0.0.1:8080;
    }

    server {
        listen 443 ssl;
        http2 on;
        server_name mcp.example.com;

        ssl_certificate     /etc/nginx/certs/server.crt;
        ssl_certificate_key /etc/nginx/certs/server.key;

        auth_jwt_key_file /etc/nginx/keys/jwks.json;

        # RFC 9728 Protected Resource Metadata
        include conf/mcp-metadata.conf;

        # 401 / 403 handlers (named locations)
        include conf/mcp-401-handler.conf;
        include conf/mcp-403-handler.conf;

        # === MCP endpoint ========================================
        location /mcp {
            include conf/mcp-resource-jwt.conf;
            # mcp-resource-jwt.conf uses `auth_jwt "mcp";` (Bearer prefix
            # stripped automatically). No `token=` override is needed.
            proxy_set_header Authorization "";   # don't pass the token upstream
            proxy_pass http://mcp_backend;
        }
    }
}
