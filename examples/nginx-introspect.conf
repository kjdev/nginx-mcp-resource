# Example: MCP Resource Server with RFC 7662 introspection
# (nginx-auth-oauth2-token 0.4.0+; the 0.4.0 release added
# `auth_oauth2_token_www_authenticate` which mcp-resource-introspect.conf
# uses to keep the WWW-Authenticate challenge standalone)
#
# Adjust the following before deployment:
#   - load_module path
#   - server_name / canonical URIs / metadata URIs
#   - ssl_certificate / ssl_certificate_key
#   - upstream mcp_backend
#   - introspection endpoint URL inside `location = /_introspect`
#   - resolver address (needed when that endpoint is an external FQDN)
#   - client credentials (id / secret)
#   - include paths under conf/ (this example assumes conf/ lives next to
#     nginx.conf; relative paths resolve against the nginx prefix)

load_module /usr/lib/nginx/modules/ngx_http_auth_oauth2_token_module.so;

worker_processes 1;
events {}

http {
    # This example defines many map variables, so the default
    # variables_hash_max_size (1024) triggers an optimization warning
    # at startup.
    variables_hash_max_size 2048;

    # === IdP client credentials =================================
    auth_oauth2_token_client_id          mcp-rs;
    auth_oauth2_token_client_secret_file /etc/nginx/secrets/rs.secret;

    # === Introspection response claim extraction =================
    auth_oauth2_token_claim_set $oauth2_aud   aud;
    auth_oauth2_token_claim_set $oauth2_scope scope;

    # === MCP metadata (edit to match your deployment) ============
    map "" $mcp_canonical_uri              { default "https://mcp.example.com/mcp"; }
    map "" $mcp_metadata_uri               { default "https://mcp.example.com/.well-known/oauth-protected-resource"; }
    map "" $mcp_required_scope             { default "mcp:read"; }
    map "" $mcp_authorization_servers_json { default '["https://auth.example.com"]'; }
    map "" $mcp_scopes_supported_json      { default '["mcp:read","mcp:write"]'; }
    map "" $mcp_bearer_methods_json        { default '["header"]'; }

    # === Audience / scope evaluation =============================
    map $oauth2_aud $mcp_aud_ok {
        default 0;
        "https://mcp.example.com/mcp" 1;
    }
    map $oauth2_scope $mcp_has_required_scope {
        default 0;
        "~(^|\s)mcp:read(\s|$)" 1;
    }

    # === Introspection cache (recommended for production) ========
    auth_oauth2_token_introspect_cache zone=introspect:10m max_ttl=60s;

    # === Upstream MCP backend ====================================
    upstream mcp_backend {
        server 127.0.0.1:8080;
    }

    # Required when the AS introspection endpoint below is an external FQDN:
    # a literal proxy_pass target resolves once at config-load time and
    # ignores this directive entirely, so /_introspect routes proxy_pass
    # through a variable to defer resolution to request time instead.
    # Replace with your DNS resolver (e.g. 127.0.0.11 for Docker's embedded
    # DNS, or your network's resolver for a bare-metal/VM deployment).
    resolver 8.8.8.8;

    server {
        listen 443 ssl;
        http2 on;
        server_name mcp.example.com;

        ssl_certificate     /etc/nginx/certs/server.crt;
        ssl_certificate_key /etc/nginx/certs/server.key;

        # Introspection endpoint (proxy to the AS RFC 7662 endpoint)
        location = /_introspect {
            internal;
            set $mcp_introspect_upstream "https://auth.example.com/oauth2/introspect";
            proxy_pass $mcp_introspect_upstream;
        }

        # RFC 9728 Protected Resource Metadata
        include conf/mcp-metadata.conf;

        # 401 / 403 handlers (named locations)
        include conf/mcp-401-handler.conf;
        include conf/mcp-403-handler.conf;

        # === MCP endpoint ========================================
        location /mcp {
            include conf/mcp-resource-introspect.conf;
            proxy_set_header Authorization "";   # don't pass the token upstream
            proxy_pass http://mcp_backend;
        }
    }
}
