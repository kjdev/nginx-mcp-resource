# MCP Resource Server - opaque token introspection snippet (RFC 7662)
#
# Include inside the location that exposes your MCP endpoint:
#
#   location /mcp {
#       include conf/mcp-resource-introspect.conf;
#       proxy_set_header Authorization "";   # don't pass the token upstream
#       proxy_pass http://mcp_backend;
#   }
#
# Caller-defined variables (declare at http scope, typically via `map`):
#   $mcp_canonical_uri        - canonical URI of this RS (RFC 8707 audience)
#   $mcp_metadata_uri         - absolute URI of
#                               /.well-known/oauth-protected-resource
#   $mcp_required_scope       - scope label echoed in WWW-Authenticate
#   $mcp_aud_ok               - 1 when introspected `aud` matches the
#                               canonical URI, else 0
#   $mcp_has_required_scope   - 1 when introspected `scope` contains the
#                               required scope token, else 0
#
# Caller-defined directives (server or http scope):
#   auth_oauth2_token_client_id ...
#   auth_oauth2_token_client_secret[_file] ...
#   auth_oauth2_token_claim_set $oauth2_aud   aud;
#   auth_oauth2_token_claim_set $oauth2_scope scope;
#
# Caller must also expose an internal location that proxy_pass'es to the
# AS introspection endpoint. Route it through a variable rather than a
# literal proxy_pass target: a literal target is resolved once at
# config-load time and ignores any `resolver` directive, so an external AS
# FQDN that isn't reachable yet at startup makes nginx fail to start
# entirely instead of just that request. e.g.
#   resolver 127.0.0.11;   # needed when the endpoint below is an external FQDN
#   location = /_introspect {
#       internal;
#       set $mcp_introspect_upstream "https://auth.example.com/oauth2/introspect";
#       proxy_pass $mcp_introspect_upstream;
#   }
#
# Pair this snippet with conf/mcp-401-handler.conf and
# conf/mcp-403-handler.conf inside the same server block.

auth_oauth2_token_introspect          on;
auth_oauth2_token_introspect_endpoint /_introspect;

# Suppress the module-emitted `Bearer error="invalid_token"` so the MCP-format
# challenge added by @mcp_unauthorized is not comma-concatenated with it.
# Requires nginx-auth-oauth2-token >= 0.4.0.
auth_oauth2_token_www_authenticate off;

# Audience binding. Mismatch -> 401.
# Note: do NOT use `if ($var = 0) { return 403; }` here. `if` runs in the
# REWRITE phase, before the ACCESS-phase introspection sets these variables,
# so the map default fires for every request and every token is rejected.
# Use auth_oauth2_token_require instead (requires nginx-auth-oauth2-token
# >= 0.3.0).
auth_oauth2_token_require $mcp_aud_ok;

# Scope enforcement. Insufficient scope -> 403 (MCP insufficient_scope).
auth_oauth2_token_require $mcp_has_required_scope error=403;

error_page 401 = @mcp_unauthorized;
error_page 403 = @mcp_forbidden;
