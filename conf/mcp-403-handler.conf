# MCP §Runtime Insufficient Scope Errors
#
# 403 challenge handler. Reached via `error_page 403 = @mcp_forbidden;`
# from mcp-resource-jwt.conf / mcp-resource-introspect.conf.
#
# Triggered when audience matches and the token is otherwise valid but the
# `scope` claim does not contain the required scope.
#
# Required variables: $mcp_metadata_uri, $mcp_required_scope.

location @mcp_forbidden {
    internal;
    add_header WWW-Authenticate
        'Bearer error="insufficient_scope", scope="$mcp_required_scope", resource_metadata="$mcp_metadata_uri"'
        always;
    return 403;
}
