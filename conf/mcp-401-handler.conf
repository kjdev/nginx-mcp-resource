# MCP §Authorization Server Discovery / RFC 9728 §5.1
#
# 401 challenge handler. Reached via `error_page 401 = @mcp_unauthorized;`
# from mcp-resource-jwt.conf / mcp-resource-introspect.conf.
#
# Triggered by: no Authorization header, signature failure, expired token,
# audience mismatch, or introspection `active: false`.
#
# Required variables: $mcp_metadata_uri, $mcp_required_scope.

location @mcp_unauthorized {
    internal;
    add_header WWW-Authenticate
        'Bearer resource_metadata="$mcp_metadata_uri", scope="$mcp_required_scope"'
        always;
    return 401;
}
