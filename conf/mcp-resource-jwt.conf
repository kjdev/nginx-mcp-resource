# MCP Resource Server - JWT validation snippet
#
# Include inside the location that exposes your MCP endpoint:
#
#   location /mcp {
#       include conf/mcp-resource-jwt.conf;
#       proxy_set_header Authorization "";   # don't pass the token upstream
#       proxy_pass http://mcp_backend;
#   }
#
# Caller-defined variables (declare at http scope, typically via `map`):
#   $mcp_canonical_uri        - canonical URI of this RS as a plain string,
#                               used inside WWW-Authenticate headers
#                               (RFC 8707 audience)
#   $mcp_canonical_uri_json   - the SAME canonical URI quoted as a JSON
#                               value, used for the JWT `aud` comparison
#                               below. Example:
#                                 map "" $mcp_canonical_uri_json {
#                                     default '"https://mcp.example.com/mcp"';
#                                 }
#                               (the embedded double-quotes are required;
#                                see V2-7 — `auth_jwt_require_claim` parses
#                                variable values as JSON, so a bare URL
#                                fails to match)
#   $mcp_metadata_uri         - absolute URI of
#                               /.well-known/oauth-protected-resource
#   $mcp_required_scope       - scope label echoed in WWW-Authenticate
#   $mcp_has_required_scope   - 1 when the JWT `scope` claim contains the
#                               required scope token, else 0
#
# Caller-defined directives (server or http scope):
#   auth_jwt_key_file ...     - JWKS used for signature verification
#   auth_jwt_claim_set $jwt_scope scope;  - extract `scope` claim
#
# Pair this snippet with conf/mcp-401-handler.conf and
# conf/mcp-403-handler.conf inside the same server block.

# Default token source is the Authorization header with the `Bearer `
# prefix stripped; this matches RFC 6750 §2.1 and lets missing-token /
# malformed-token requests reach the auth_jwt validator (and our
# error_page) consistently.
auth_jwt "mcp";

# Suppress nginx-auth-jwt's own `Bearer realm="..."` header so the MCP-format
# challenge added by @mcp_unauthorized is not comma-concatenated with it.
# Requires nginx-auth-jwt >= 0.13.1.
auth_jwt_www_authenticate off;

# RFC 8707 audience binding. Mismatch -> 401.
# $mcp_canonical_uri_json must hold the canonical URI as a JSON-quoted
# string (e.g. '"https://mcp.example.com/mcp"'). See V2-7 for the rationale.
# If your AS issues `aud` as a JSON array, replace this line with one of:
#   auth_jwt_require_claim .aud[0] eq $mcp_canonical_uri_json;
#   auth_jwt_require_claim aud any json=["https://mcp.example.com/mcp"];
auth_jwt_require_claim aud eq $mcp_canonical_uri_json;

# Scope enforcement. Insufficient scope -> 403 (MCP insufficient_scope).
auth_jwt_require $mcp_has_required_scope error=403;

error_page 401 = @mcp_unauthorized;
error_page 403 = @mcp_forbidden;
