# RFC 9728 §3 - OAuth 2.0 Protected Resource Metadata
#
# Publishes the JSON document that MCP clients fetch after seeing the
# `resource_metadata` parameter of the WWW-Authenticate challenge
# (RFC 9728 §5.1).
#
# Usage
#   - include inside the `server { }` block that fronts your MCP backend
#   - declare the variables below at http scope (typically via `map ""`)
#   - keep `$mcp_required_scope` aligned with the value advertised in
#     mcp-401-handler.conf / mcp-403-handler.conf
#
# Caller-defined variables (declare at http scope, typically via `map`):
#   $mcp_canonical_uri              - canonical URI of this RS (RFC 8707 audience),
#                                     emitted as the `resource` field
#   $mcp_authorization_servers_json - JSON array literal of authorization servers,
#                                     e.g. '["https://auth.example.com"]'
#   $mcp_scopes_supported_json      - JSON array literal of scopes_supported,
#                                     e.g. '["mcp:read","mcp:write"]'
#   $mcp_bearer_methods_json        - JSON array literal of bearer_methods_supported,
#                                     e.g. '["header"]'
#
# The path `/.well-known/oauth-protected-resource` is fixed by RFC 9728 §3.

location = /.well-known/oauth-protected-resource {
    default_type application/json;
    return 200 '{"resource":"$mcp_canonical_uri","authorization_servers":$mcp_authorization_servers_json,"scopes_supported":$mcp_scopes_supported_json,"bearer_methods_supported":$mcp_bearer_methods_json}';
}
