# RFC 9728 §3 - OAuth 2.0 Protected Resource Metadata
#
# Publishes the JSON document that MCP clients fetch after seeing the
# `resource_metadata` parameter of the WWW-Authenticate challenge
# (RFC 9728 §5.1).
#
# Usage
#   - include inside the `server { }` block that fronts your MCP backend
#   - replace the `resource` URI with your canonical MCP endpoint
#     (must match the audience your AS embeds in JWT `aud` / introspection
#      response `aud`; RFC 8707 §2)
#   - keep `scopes_supported` aligned with the `scope` value advertised in
#     mcp-401-handler.conf / mcp-403-handler.conf
#
# The path `/.well-known/oauth-protected-resource` is fixed by RFC 9728 §3.

location = /.well-known/oauth-protected-resource {
    default_type application/json;
    return 200 '{
  "resource": "https://mcp.example.com/mcp",
  "authorization_servers": ["https://auth.example.com"],
  "scopes_supported": ["mcp:read", "mcp:write"],
  "bearer_methods_supported": ["header"]
}';
}
